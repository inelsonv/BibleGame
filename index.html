<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Duelo Bíblico</title>
<meta name="description" content="Trivia bíblica por equipos: elige un libro, responde por turnos y compite por el marcador." />
<style>
  html, body { margin: 0; padding: 0; background: #0F1A2E; overflow-x: hidden; }
  #root { min-height: 100vh; }
  #loading { color: #B8A98A; font-family: sans-serif; text-align: center; padding: 60px 20px; }
</style>
</head>
<body>
<div id="root"><div id="loading">Cargando Duelo Bíblico…</div></div>

<!-- React 18 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel: permite escribir JSX directo en el navegador, sin paso de compilación -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js" crossorigin></script>

<script>
  // Reemplaza el almacenamiento propio de Claude (window.storage) por
  // localStorage del navegador, para que "Mis preguntas" y la
  // configuración se guarden igual, pero de forma independiente.
  window.storage = {
    get(key) {
      return new Promise((resolve, reject) => {
        const raw = localStorage.getItem(key);
        if (raw === null) { reject(new Error("not found")); return; }
        resolve({ key, value: raw });
      });
    },
    set(key, value) {
      return new Promise((resolve) => {
        localStorage.setItem(key, value);
        resolve({ key, value });
      });
    },
    delete(key) {
      return new Promise((resolve) => {
        localStorage.removeItem(key);
        resolve({ key, deleted: true });
      });
    },
    list(prefix) {
      return new Promise((resolve) => {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        resolve({ keys, prefix });
      });
    },
  };
</script>

<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
